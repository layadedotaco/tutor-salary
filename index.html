<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家教薪資計算器</title>
<style>
:root{--bg1:#f4f1ff;--bg2:#fff5f8;--card:#fff;--text:#25233a;--muted:#74718a;--primary:#7357d8;--soft:#eee9ff;--border:#e8e4f1;--danger:#d9465f;--success:#168967}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:18px}
.container{width:min(1120px,100%);margin:auto}.hero{text-align:center;margin-bottom:18px}.hero h1{margin:0 0 6px}.hero p,.hint{color:var(--muted)}
.card,.toolbar{background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:16px}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar .field{flex:1;min-width:180px;margin:0}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.field{margin-bottom:12px}label{display:block;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#f2f0f6;color:var(--text)}.danger{background:#fff0f3;color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.student-list{display:grid;gap:9px;margin-top:14px}.student-item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fbfaff}
.student-top{display:flex;justify-content:space-between;gap:8px}.student-name{font-weight:900}.student-rate{font-size:13px;color:var(--muted);margin-top:3px}.student-total{font-weight:900;color:var(--success);margin-top:8px}
.calendar-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.month-total{padding:9px 12px;background:#edfff8;border:1px solid #bcead9;border-radius:13px;color:var(--success);font-weight:900}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;font-weight:800;color:var(--muted);padding:5px}.day{min-height:82px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:7px;cursor:pointer}.empty-day{opacity:.35;cursor:default}.day-number{font-weight:900}.lesson-chip{margin-top:4px;padding:4px;background:var(--soft);border-radius:8px;text-align:center;font-size:11px;color:#4c379c}
.summary-table{width:100%;border-collapse:collapse}.summary-table th,.summary-table td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.summary-table th:last-child,.summary-table td:last-child{text-align:right}
.empty{padding:16px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,20,47,.45);align-items:center;justify-content:center;padding:16px}.modal-bg.show{display:flex}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center}
.lesson-row{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;background:#faf9fd}.small{padding:7px 9px;font-size:12px}
.sync-note{margin-top:8px;font-size:12px;color:var(--muted)}
@media(max-width:850px){body{padding:10px}.layout{grid-template-columns:1fr}.day{min-height:70px}.calendar{gap:4px}}
</style>
</head>
<body>
<main class="container">
<section class="hero">
<h1>📚 家教薪資計算器</h1>
<p>管理學生時薪、登記上課日期與時間，自動統計每月薪資。</p>
</section>

<section class="toolbar">
<div class="field"><label for="monthPicker">查看月份</label><input id="monthPicker" type="month"></div>
<div class="actions">
<button class="secondary" id="prevMonth">← 上個月</button>
<button class="secondary" id="nextMonth">下個月 →</button>
<button class="primary" id="syncWidget">📱 更新桌面 Widget</button>
<button class="danger" id="clearMonth">清除本月紀錄</button>
</div>
</section>

<section class="layout">
<aside class="card">
<h2>學生管理</h2>
<div class="field"><label for="studentName">學生名稱</label><input id="studentName" placeholder="例如：S學生"></div>
<div class="field"><label for="studentRate">時薪（元）</label><input id="studentRate" type="number" min="0" step="1" placeholder="例如：750"></div>
<button class="primary" id="addStudent">新增學生</button>
<div class="student-list" id="studentList"></div>
<p class="hint">資料仍只存在這台裝置的瀏覽器中；新版沿用原本儲存格式。</p>
</aside>

<section>
<div class="card">
<div class="calendar-head">
<h2 id="calendarTitle">本月課程</h2>
<div class="month-total">本月總薪資：<span id="monthTotal">$0</span></div>
</div>
<div class="calendar" id="calendar"></div>
</div>

<div class="card">
<h2>本月學生薪資統計</h2>
<div id="summaryWrap"></div>
<div class="sync-note">更新桌面時會同步目前「查看月份」的各學生薪資。</div>
</div>
</section>
</section>
</main>

<div class="modal-bg" id="lessonModal">
<div class="modal">
<div class="modal-head"><div><h2 style="margin:0">登記上課</h2><div class="hint" id="selectedDateText"></div></div><button class="secondary" id="closeModal">✕</button></div>
<div id="dayLessonList"></div>
<h3>新增一筆課程</h3>
<div class="field"><label for="lessonStudent">學生</label><select id="lessonStudent"></select></div>
<div class="field"><label for="startTime">上課時間</label><input id="startTime" type="time" value="18:00"></div>
<div class="field"><label for="endTime">下課時間</label><input id="endTime" type="time" value="20:00"></div>
<button class="primary" id="saveLesson">加入課程</button>
</div>
</div>

<script>
const STORAGE_KEY="tutorSalaryCalculatorV2";
const SCRIPT_NAME="TutorSalaryWidget";

let state={students:[],lessons:[]};
let selectedDate="";

const money=v=>new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(Math.round(v));
const pad=v=>String(v).padStart(2,"0");
const todayMonth=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};

function loadState(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return;
  try{
    const p=JSON.parse(raw);
    if(Array.isArray(p.students))state.students=p.students;
    if(Array.isArray(p.lessons))state.lessons=p.lessons;
  }catch(e){console.error(e)}
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function month(){return document.getElementById("monthPicker").value||todayMonth()}
function student(id){return state.students.find(s=>s.id===id)}
function duration(l){
  const [sh,sm]=l.start.split(":").map(Number),[eh,em]=l.end.split(":").map(Number);
  return Math.max(0,(eh*60+em)-(sh*60+sm))/60
}
function pay(l){const s=student(l.studentId);return s?duration(l)*Number(s.rate):0}
function monthLessons(){return state.lessons.filter(l=>l.date.startsWith(month()))}
function stats(id){
  const ls=monthLessons().filter(l=>l.studentId===id);
  return {count:ls.length,hours:ls.reduce((a,l)=>a+duration(l),0),pay:ls.reduce((a,l)=>a+pay(l),0)}
}
function escapeHtml(v){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")
}

function renderOptions(){
  const el=document.getElementById("lessonStudent");el.innerHTML="";
  if(!state.students.length){el.innerHTML='<option value="">請先新增學生</option>';return}
  state.students.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=`${s.name}（時薪 ${money(s.rate)}）`;el.appendChild(o)})
}
function renderStudents(){
  const el=document.getElementById("studentList");el.innerHTML="";
  if(!state.students.length){el.innerHTML='<div class="empty">目前還沒有學生</div>';renderOptions();return}
  state.students.forEach(s=>{
    const x=stats(s.id),d=document.createElement("div");d.className="student-item";
    d.innerHTML=`<div class="student-top"><div><div class="student-name">${escapeHtml(s.name)}</div><div class="student-rate">時薪 ${money(s.rate)}</div></div><button class="danger small" data-del-student="${s.id}">刪除</button></div><div class="student-total">本月 ${x.count} 堂・${x.hours.toFixed(2)} 小時・${money(x.pay)}</div>`;
    el.appendChild(d)
  });
  el.querySelectorAll("[data-del-student]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.delStudent,s=student(id);if(!s)return;
    if(!confirm(`確定刪除「${s.name}」及他的課程紀錄嗎？`))return;
    state.students=state.students.filter(x=>x.id!==id);state.lessons=state.lessons.filter(x=>x.studentId!==id);saveState();renderAll()
  }));
  renderOptions()
}
function renderCalendar(){
  const el=document.getElementById("calendar");el.innerHTML="";
  ["日","一","二","三","四","五","六"].forEach(x=>{const d=document.createElement("div");d.className="weekday";d.textContent=x;el.appendChild(d)});
  const [y,m]=month().split("-").map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
  document.getElementById("calendarTitle").textContent=`${y} 年 ${m} 月課程`;
  for(let i=0;i<first;i++){const d=document.createElement("div");d.className="day empty-day";el.appendChild(d)}
  for(let n=1;n<=days;n++){
    const date=`${y}-${pad(m)}-${pad(n)}`,ls=state.lessons.filter(l=>l.date===date).sort((a,b)=>a.start.localeCompare(b.start));
    const d=document.createElement("div");d.className="day";
    d.innerHTML=`<div class="day-number">${n}</div>${ls.slice(0,3).map(l=>{const s=student(l.studentId);return s?`<div class="lesson-chip">${escapeHtml(s.name)}</div>`:""}).join("")}`;
    d.addEventListener("click",()=>openModal(date));el.appendChild(d)
  }
}
function renderSummary(){
  const active=state.students.map(s=>({s,x:stats(s.id)})).filter(o=>o.x.count>0),total=active.reduce((a,o)=>a+o.x.pay,0);
  document.getElementById("monthTotal").textContent=money(total);
  const el=document.getElementById("summaryWrap");
  if(!active.length){el.innerHTML='<div class="empty">這個月份還沒有上課紀錄</div>';return}
  el.innerHTML=`<table class="summary-table"><thead><tr><th>學生</th><th>堂數</th><th>時數</th><th>應付薪資</th></tr></thead><tbody>${active.map(o=>`<tr><td>${escapeHtml(o.s.name)}</td><td>${o.x.count}</td><td>${o.x.hours.toFixed(2)} 小時</td><td><strong>${money(o.x.pay)}</strong></td></tr>`).join("")}</tbody></table>`
}
function renderAll(){renderStudents();renderCalendar();renderSummary();if(selectedDate)renderDayLessons()}

function addStudent(){
  const n=document.getElementById("studentName"),r=document.getElementById("studentRate"),name=n.value.trim(),rate=Number(r.value);
  if(!name)return alert("請輸入學生名稱");
  if(!Number.isFinite(rate)||rate<=0)return alert("請輸入正確時薪");
  state.students.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,name,rate});
  n.value="";r.value="";saveState();renderAll()
}
function openModal(date){selectedDate=date;document.getElementById("selectedDateText").textContent=date;renderOptions();renderDayLessons();document.getElementById("lessonModal").classList.add("show")}
function closeModal(){document.getElementById("lessonModal").classList.remove("show")}
function renderDayLessons(){
  const el=document.getElementById("dayLessonList"),ls=state.lessons.filter(l=>l.date===selectedDate).sort((a,b)=>a.start.localeCompare(b.start));
  if(!ls.length){el.innerHTML='<div class="empty">這一天還沒有課程</div>';return}
  el.innerHTML=ls.map(l=>{const s=student(l.studentId);return s?`<div class="lesson-row"><div class="student-top"><strong>${escapeHtml(s.name)}</strong><button class="danger small" data-del-lesson="${l.id}">刪除</button></div><div class="hint">${l.start}–${l.end}・${duration(l).toFixed(2)} 小時・${money(pay(l))}</div></div>`:""}).join("");
  el.querySelectorAll("[data-del-lesson]").forEach(b=>b.addEventListener("click",()=>{state.lessons=state.lessons.filter(l=>l.id!==b.dataset.delLesson);saveState();renderAll()}))
}
function saveLesson(){
  if(!state.students.length)return alert("請先新增學生");
  const studentId=document.getElementById("lessonStudent").value,start=document.getElementById("startTime").value,end=document.getElementById("endTime").value;
  if(!studentId||!start||!end)return alert("請完整選擇學生與時間");
  if(end<=start)return alert("下課時間必須晚於上課時間");
  state.lessons.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,studentId,date:selectedDate,start,end});
  saveState();renderAll()
}
function changeMonth(offset){
  const [y,m]=month().split("-").map(Number),d=new Date(y,m-1+offset,1);
  document.getElementById("monthPicker").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderAll()
}
function clearMonth(){
  const mm=month(),count=state.lessons.filter(l=>l.date.startsWith(mm)).length;
  if(!count)return alert("這個月份沒有課程紀錄");
  if(!confirm(`確定刪除 ${mm} 的全部 ${count} 筆課程紀錄嗎？`))return;
  state.lessons=state.lessons.filter(l=>!l.date.startsWith(mm));saveState();renderAll()
}
function syncWidget(){
  const students=state.students.map(s=>{const x=stats(s.id);return {name:s.name,count:x.count,hours:Number(x.hours.toFixed(2)),pay:Math.round(x.pay)}}).filter(x=>x.count>0);
  if(!students.length)return alert("這個月份還沒有上課紀錄");
  const payload={month:month(),students,total:students.reduce((a,s)=>a+s.pay,0),updatedAt:new Date().toISOString()};
  const data=encodeURIComponent(JSON.stringify(payload));
  const url=`https://open.scriptable.app/run/${SCRIPT_NAME}?data=${data}`;
  window.location.href=url;
}

document.getElementById("addStudent").addEventListener("click",addStudent);
document.getElementById("monthPicker").addEventListener("change",renderAll);
document.getElementById("prevMonth").addEventListener("click",()=>changeMonth(-1));
document.getElementById("nextMonth").addEventListener("click",()=>changeMonth(1));
document.getElementById("syncWidget").addEventListener("click",syncWidget);
document.getElementById("clearMonth").addEventListener("click",clearMonth);
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("saveLesson").addEventListener("click",saveLesson);
document.getElementById("lessonModal").addEventListener("click",e=>{if(e.target.id==="lessonModal")closeModal()});

loadState();
document.getElementById("monthPicker").value=todayMonth();
renderAll();
</script>
</body>
</html>
